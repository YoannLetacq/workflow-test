<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input { flex: 1; padding: .5rem; font: inherit; }
    button { padding: .5rem .75rem; font: inherit; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #ddd; }
    li .body { flex: 1; }
    li.done .body { text-decoration: line-through; color: #888; }
    .title { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <form id="add-form">
    <input id="title" placeholder="Title" required>
    <input id="body" placeholder="Body">
    <button type="submit">Add</button>
  </form>
  <ul id="notes"></ul>
  <script src="app.js"></script>
</body>
</html>
